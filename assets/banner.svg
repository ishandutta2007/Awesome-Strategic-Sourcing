<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- Inline Styles for Animation -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes shimmer {
        0% { opacity: 0.4; }
        50% { opacity: 0.9; }
        100% { opacity: 0.4; }
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatReverse 8s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-3 {
        animation: floatSlow 6s ease-in-out 1s infinite;
        transform-origin: center;
      }
      .pulsing-orb {
        animation: pulseOrb 8s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-glow-2 {
        animation: pulseOrb 10s ease-in-out 2s infinite;
        transform-origin: center;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: dashFlow 2.5s linear infinite;
      }
      .shimmer-badge {
        animation: shimmer 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Slate Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="250" y1="0" x2="250" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="550" y1="0" x2="550" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="850" y1="0" x2="850" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
    <line x1="1150" y1="0" x2="1150" y2="320"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#glow-blur)">
    <circle cx="200" cy="100" r="130" fill="#06b6d4" class="pulsing-orb"/>
    <circle cx="1020" cy="200" r="140" fill="#8b5cf6" class="pulse-glow-2"/>
    <circle cx="620" cy="280" r="90" fill="#3b82f6" opacity="0.25"/>
  </g>

  <!-- Dynamic Sourcing Process Flow Lines (Left to Right in Background) -->
  <g fill="none" stroke-width="2" opacity="0.45">
    <path d="M 80 250 Q 220 180, 360 240 T 640 220 T 920 250 T 1120 190" stroke="#38bdf8" class="flow-path"/>
    <path d="M 120 90 Q 300 130, 480 80 T 800 110 T 1080 70" stroke="#c084fc" stroke-dasharray="6, 6" class="flow-path" style="animation-duration: 3.5s;"/>
  </g>

  <!-- Ambient Floating Indicator Cards (Background/Flanks - Carefully positioned outside central title) -->
  <!-- Card 1: Top Right - Sourcing Optimizer -->
  <g class="floating-card-1">
    <rect x="940" y="38" width="215" height="58" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle cx="968" cy="67" r="14" fill="#38bdf8" fill-opacity="0.18"/>
    <text x="968" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">⚙️</text>
    <text x="994" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">RFQ Optimization</text>
    <text x="994" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Multi-scenario awards</text>
  </g>

  <!-- Card 2: Bottom Right - Savings Tracking -->
  <g class="floating-card-2">
    <rect x="970" y="215" width="195" height="58" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle cx="998" cy="244" r="14" fill="#10b981" fill-opacity="0.18"/>
    <text x="998" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">📈</text>
    <text x="1022" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Spend Analytics</text>
    <text x="1022" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#34d399">12.4% Avg Savings</text>
  </g>

  <!-- Card 3: Top Left - Supplier Intel -->
  <g class="floating-card-3">
    <rect x="42" y="42" width="200" height="58" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle cx="70" cy="71" r="14" fill="#a855f7" fill-opacity="0.18"/>
    <text x="70" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#a855f7" text-anchor="middle">🎯</text>
    <text x="94" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Supplier Discovery</text>
    <text x="94" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#c084fc">ESG &amp; Risk Scoring</text>
  </g>

  <!-- Card 4: Bottom Left - Reverse Auctions -->
  <g class="floating-card-1">
    <rect x="42" y="215" width="210" height="58" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle cx="70" cy="244" r="14" fill="#f59e0b" fill-opacity="0.18"/>
    <text x="70" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">⚡</text>
    <text x="94" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">e-Auctions &amp; Bidding</text>
    <text x="94" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#fbbf24">Real-Time Price Discovery</text>
  </g>

  <!-- Center Foreground Content: Clearly readable, high-contrast, immune to obstruction -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" class="shimmer-badge"/>
      <circle cx="-116" cy="0" r="4" fill="#38bdf8"/>
      <text x="6" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="1.2">
        STRATEGIC SOURCING ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#primary-glow)">Strategic Sourcing</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Curated Directory of Sourcing Platforms, RFQ Engines, Spend Intelligence &amp; Open-Source Procurement
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(600, 226)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      <!-- Tag 1 -->
      <rect x="-240" y="-12" width="105" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="-187" y="4" fill="#38bdf8">📦 RFx / RFQ</text>

      <!-- Tag 2 -->
      <rect x="-125" y="-12" width="125" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="-62" y="4" fill="#818cf8">⚡ e-Auctions</text>

      <!-- Tag 3 -->
      <rect x="10" y="-12" width="115" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="67" y="4" fill="#c084fc">🤖 AI Sourcing</text>

      <!-- Tag 4 -->
      <rect x="135" y="-12" width="115" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="192" y="4" fill="#34d399">📊 Spend Intel</text>
    </g>
  </g>

  <!-- Outer Sleek Border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#334155" stroke-width="1" opacity="0.6"/>
</svg>
